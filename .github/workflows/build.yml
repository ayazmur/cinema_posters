name: Build EXE and release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller cinema.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinofisha-windows
          path: dist/Kinofisha.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Киноафиша — последняя сборка"
          body: |
            Автоматическая сборка приложения.

            * Ветка: `${{ github.ref_name }}`
            * Коммит: `${{ github.sha }}`
            * Запуск: #${{ github.run_number }}

            Скачайте `Kinofisha.exe` и запустите — установка не требуется.
          files: dist/Kinofisha.exe
          make_latest: true
          generate_release_notes: false
